name: Build cursedhouse chat mod

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-21

      - name: Build
        run: cmake --build build --parallel

      - name: Upload SO
        uses: actions/upload-artifact@v4
        with:
          name: cursedhouse-chat-armeabi-v7a
          path: build/libcursedhouse_chat.so
