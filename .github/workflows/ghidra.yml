      - name: Analiz ve cikarma
        run: |
          GH=$(ls -d $PWD/ghidra/ghidra_* | head -1)
          sed -i 's/^MAXMEM=.*/MAXMEM="8G"/' "$GH/support/analyzeHeadless"
          mkdir -p output proj
          for f in input/*.so; do
            [ -e "$f" ] || { echo "input/ icinde .so yok"; exit 1; }
            n=$(basename "$f" .so)
            mkdir -p "output/$n"
            "$GH/support/analyzeHeadless" "$PWD/proj" "p_$n" \
              -import "$f" \
              -analysisTimeoutPerFile 3000 \
              -scriptPath "$PWD/scripts" \
              -postScript ExtractCow.java "$PWD/output/$n" \
              -deleteProject > "output/$n/headless_log.txt" 2>&1 || true
            tail -n 40 "output/$n/headless_log.txt"
          doneiz ve cikarma
        run: |
          GH=$(ls -d $PWD/ghidra/ghidra_* | head -1)
